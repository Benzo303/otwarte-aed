[project]
name = "otwarte-aed"
version = "0.1.0"
description = "Ogólnopolska mapa AED i integracja otwartych danych"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.34",
    "requests==2.34.2",
    "openpyxl==3.1.5",
    "lxml==6.1.3",
    "opening-hours-py==2.1.6",
    "tzdata==2026.6",
    "httpx==0.28.1",
    "qrcode==8.2",
    "beautifulsoup4==4.15.0",
    "pypdf==7.1.1",
    "pdfplumber==0.11.11",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app:app"
